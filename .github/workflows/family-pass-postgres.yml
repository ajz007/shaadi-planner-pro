name: Family Pass PostgreSQL upgrade

on:
  pull_request:
    paths:
      - '.github/workflows/family-pass-postgres.yml'
      - 'cmd/shaadi-planner/**'
      - 'internal/workspace/**'
      - 'web/assets.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family-pass-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify the upgrade and Family Pass lifecycle
        shell: bash
        run: |
          db_password="$(openssl rand -hex 24)"
          printf '::add-mask::%s\n' "$db_password"
          container="$(POSTGRES_PASSWORD="$db_password" docker run --detach --rm \
            --env POSTGRES_PASSWORD --env POSTGRES_USER=shaadi_ci --env POSTGRES_DB=shaadi_family_upgrade \
            --publish 127.0.0.1::5432 postgres:18)"
          trap 'docker rm --force "$container" >/dev/null' EXIT

          for attempt in {1..30}; do
            if docker exec "$container" pg_isready -h 127.0.0.1 -U shaadi_ci -d shaadi_family_upgrade >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'The disposable PostgreSQL server did not become ready.' >&2
              exit 1
            fi
            sleep 2
          done

          port_binding="$(docker port "$container" 5432/tcp)"
          export SHAADI_FAMILY_UPGRADE_DATABASE_URL="postgres://shaadi_ci:$db_password@127.0.0.1:${port_binding##*:}/shaadi_family_upgrade?sslmode=disable"
          baseline="$(mktemp -d)"
          # This main revision includes invitation publishing at migration 019.
          git archive fa62c81ff02a2402fec523e2a5f90202d830d354 | tar -x -C "$baseline"
          (cd "$baseline" && SHAADI_DATABASE_URL="$SHAADI_FAMILY_UPGRADE_DATABASE_URL" go run ./cmd/shaadi-planner migrate-workspace)
          go test ./internal/workspace -run '^TestFamilyPassUpgradeAndRetention$' -count=1 -v
